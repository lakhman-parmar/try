<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" (click)="toggleSidebar()">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="logo-mark">
        <span class="logo-text">R/D</span>
      </div>
      <span class="brand-name">RapidDevs</span>
    </div>
    <div class="topbar-right">
      <div class="avatar" title="Account">
        <span class="material-symbols-outlined">account_circle</span>
      </div>
    </div>
  </header>
  <div class="body-row">
    <app-sidebar [mobileOpen]="sidebarOpen()" (mobileClose)="closeSidebar()" />
    <main class="content-area">
      <router-outlet />
    </main>
  </div>
</div>
