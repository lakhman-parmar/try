<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-panel" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="material-symbols-outlined modal-title-icon">
          {{ isEdit() ? 'edit' : 'add_circle' }}
        </span>
        <h2 class="modal-title">{{ title }}</h2>
      </div>
      <button class="icon-action" type="button" title="Close" (click)="cancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body" [formGroup]="productForm">
      @if (loading()) {
        <div class="loading-state">
          <mat-spinner diameter="28"></mat-spinner>
          <span>Loading...</span>
        </div>
      } @else {
        <div class="form-grid">
          <!-- Name -->
          <label class="form-field full-col">
            <span class="field-label required">Product Name</span>
            <input
              class="field-control"
              [class.invalid-control]="
                productForm.get('name')?.touched && productForm.get('name')?.invalid
              "
              placeholder="e.g. Cement 50kg"
              formControlName="name"
            />
            @if (productForm.get('name')?.touched && productForm.get('name')?.invalid) {
              <span class="field-error">Product name is required (max 500 characters)</span>
            }
          </label>

          <!-- Description -->
          <label class="form-field full-col">
            <span class="field-label">Description</span>
            <textarea
              class="field-control textarea-control"
              rows="2"
              placeholder="Optional description"
              formControlName="description"
            ></textarea>
          </label>

          <!-- Selling Price -->
          <label class="form-field">
            <span class="field-label required">Selling Price (₹)</span>
            <input
              class="field-control"
              [class.invalid-control]="
                productForm.get('sellingPrice')?.touched && productForm.get('sellingPrice')?.invalid
              "
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              formControlName="sellingPrice"
            />
            @if (
              productForm.get('sellingPrice')?.touched && productForm.get('sellingPrice')?.invalid
            ) {
              @if (productForm.get('sellingPrice')?.hasError('required')) {
                <span class="field-error">Selling price is required</span>
              } @else if (productForm.get('sellingPrice')?.hasError('min')) {
                <span class="field-error">Selling price cannot be negative</span>
              }
            } @else {
              <span class="field-hint">Price at which you sell to customers</span>
            }
          </label>

          <!-- Unit -->
          <label class="form-field">
            <span class="field-label required">Unit</span>
            <div class="select-wrapper">
              <select
                class="field-control"
                [class.invalid-control]="
                  productForm.get('unitId')?.touched && productForm.get('unitId')?.invalid
                "
                formControlName="unitId"
              >
                <option [value]="null">— Select unit —</option>
                @for (unit of units(); track unit.unitId) {
                  <option [value]="unit.unitId">{{ unit.name }} ({{ unit.shortName }})</option>
                }
              </select>
              <span class="material-symbols-outlined select-arrow">expand_more</span>
            </div>
            @if (productForm.get('unitId')?.touched && productForm.get('unitId')?.invalid) {
              <span class="field-error">Please select a unit</span>
            } @else {
              <span class="field-hint">&nbsp;</span>
            }
          </label>
        </div>
      }
    </div>

    <div class="modal-footer">
      <button class="secondary-action" type="button" (click)="cancel()" [disabled]="saving()">
        Cancel
      </button>
      <button
        class="primary-action"
        type="button"
        (click)="save()"
        [disabled]="!canSave || saving()"
      >
        @if (saving()) {
          Saving...
        } @else {
          {{ isEdit() ? 'Save Changes' : 'Create Product' }}
        }
      </button>
    </div>
  </div>
</div>
