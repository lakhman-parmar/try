<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-panel" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="material-symbols-outlined modal-title-icon">
          {{ isEdit() ? 'edit' : 'add_circle' }}
        </span>
        <h2 class="modal-title">{{ title }}</h2>
      </div>
      <button class="icon-action" type="button" title="Close" (click)="cancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="modal-body">
      @if (loading()) {
        <div class="loading-state">
          <mat-spinner diameter="28"></mat-spinner>
          <span>Loading...</span>
        </div>
      } @else {
        <div class="form-grid">
          <!-- Name -->
          <label class="form-field full-col">
            <span class="field-label required">Product Name</span>
            <input
              class="field-control"
              placeholder="e.g. Cement 50kg"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
            />
          </label>

          <!-- Description -->
          <label class="form-field full-col">
            <span class="field-label">Description</span>
            <textarea
              class="field-control textarea-control"
              rows="2"
              placeholder="Optional description"
              [ngModel]="description()"
              (ngModelChange)="description.set($event)"
            ></textarea>
          </label>

          <!-- Selling Price -->
          <label class="form-field">
            <span class="field-label">Selling Price (₹)</span>
            <input
              class="field-control"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              [ngModel]="sellingPrice()"
              (ngModelChange)="sellingPrice.set($event ? +$event : null)"
            />
            <span class="field-hint">Price at which you sell to customers</span>
          </label>

          <!-- Unit -->
          <label class="form-field">
            <span class="field-label">Unit</span>
            <select
              class="field-control"
              [ngModel]="unitId()"
              (ngModelChange)="unitId.set($event ? +$event : null)"
            >
              <option [value]="null">— Select unit —</option>
              @for (unit of units(); track unit.unitId) {
                <option [value]="unit.unitId">{{ unit.name }} ({{ unit.shortName }})</option>
              }
            </select>
          </label>
        </div>

        @if (error()) {
          <div class="error-banner">
            <span class="material-symbols-outlined">error</span>
            {{ error() }}
          </div>
        }
      }
    </div>

    <div class="modal-footer">
      <button class="secondary-action" type="button" (click)="cancel()" [disabled]="saving()">
        Cancel
      </button>
      <button
        class="primary-action"
        type="button"
        (click)="save()"
        [disabled]="!canSave || saving()"
      >
        @if (saving()) {
          Saving...
        } @else {
          {{ isEdit() ? 'Save Changes' : 'Create Product' }}
        }
      </button>
    </div>
  </div>
</div>
