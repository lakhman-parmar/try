<div class="login-container">
  <div class="login-shell">
    <!-- Left Panel: Brand & Info -->
    <section class="login-panel login-panel--info">
      <div>
        <!-- Space for logo if needed -->
      </div>

      <div class="panel-content">
        <span class="panel-eyebrow">RapidDev Account Management</span>
        <h1>Manage your organization's access.</h1>
        <p>A centralized hub for onboarding, profile updates, and secure role-based permissions.</p>
      </div>

      <div class="panel-footer">
        <p>&copy; 2026 RapidDev Inc.</p>
      </div>
    </section>

    <!-- Right Panel: Form -->
    <section class="login-panel login-panel--form">
      <div class="login-card">
        <h2>Welcome back</h2>
        <p class="login-subtitle">Please enter your details to sign in.</p>

        @if (errorMessage()) {
          <div class="alert">
            {{ errorMessage() }}
          </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="form-group">
            <app-input
              label="Email"
              type="email"
              placeholder="name@company.com"
              formControlName="email"
            ></app-input>
          </div>

          <div class="form-group">
            <app-input
              label="Password"
              type="password"
              placeholder="Enter your password"
              formControlName="password"
            ></app-input>
          </div>

          <button type="submit" class="btn-primary" [disabled]="isLoading() || loginForm.invalid">
            @if (isLoading()) {
              <span class="spinner-border-sm" role="status" aria-hidden="true"></span>
              <span>Signing in...</span>
            } @else {
              <span>Sign in</span>
            }
          </button>
        </form>

        <div class="text-center">
          <p>
            Need help?
            <a href="#">Contact admin</a>
          </p>
        </div>
      </div>
    </section>
  </div>
</div>
